name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pterodactyl-mysql
          tags: |
            type=raw,value=8.4
            type=sha

      - name: Build for test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mysql-test:ci

      # Boot it the way Wings does: its uid, its dropped capabilities,
      # no-new-privileges, a tty, a 1 GB limit, and a startup line prefixed the
      # way the Renode panel prefixes it. Nothing is pushed unless all passes.
      - name: Boot test
        run: |
          set -e
          mkdir -p /tmp/vol && sudo chown 988:988 /tmp/vol
          STARTUP=': renode_banner_begin; if [ -n "$RENODE_BANNER" ]; then printf "%s" "$RENODE_BANNER" | base64 -d 2>/dev/null || true; fi; : renode_banner_end; mysqld --defaults-file=/tmp/renode.cnf'
          run() {
            docker run -d -t -i --name "$1" --user 988:988 \
              --cap-drop setpcap --cap-drop mknod --cap-drop audit_write --cap-drop net_raw \
              --cap-drop dac_override --cap-drop fowner --cap-drop fsetid --cap-drop net_bind_service \
              --cap-drop sys_chroot --cap-drop setfcap --security-opt no-new-privileges \
              --memory 1g -p 25725:25725 -v /tmp/vol:/home/container \
              -e SERVER_PORT=25725 -e MYSQL_ROOT_PASSWORD=RootPassw0rd123 \
              -e MYSQL_DATABASE=ci_db -e MYSQL_USER=app -e MYSQL_PASSWORD=AppPassw0rd456 \
              -e RENODE_BANNER="$(printf 'RENODE BANNER OK\n' | base64)" \
              -e STARTUP="$STARTUP" mysql-test:ci
          }
          wait_ready() {
            for i in $(seq 1 90); do
              docker logs "$1" 2>&1 | grep -q 'mysqld: ready for connections' && return 0
              docker inspect -f '{{.State.Running}}' "$1" | grep -q true || break
              sleep 2
            done
            docker logs "$1" 2>&1 | tail -60
            return 1
          }
          stop() {
            docker kill --signal INT "$1"
            for i in $(seq 1 60); do docker inspect -f '{{.State.Running}}' "$1" | grep -q false && break; sleep 1; done
            docker logs "$1" 2>&1 | tail -4
            docker inspect -f 'exit={{.State.ExitCode}} running={{.State.Running}}' "$1" | tee /dev/stderr | grep -q 'exit=0 running=false'
          }
          q() { mysql --protocol=TCP -h127.0.0.1 -P25725 "$@"; }

          run ci
          wait_ready ci
          docker logs ci 2>&1 | tail -30
          docker logs ci 2>&1 | grep -q 'RENODE BANNER OK'
          test "$(docker logs ci 2>&1 | grep -c 'mysqld: ready for connections')" = 1
          docker logs ci 2>&1 | grep 'ready for connections'

          q -uapp -pAppPassw0rd456 ci_db -e 'CREATE TABLE t (id INT PRIMARY KEY); INSERT INTO t VALUES (42);'
          q -uroot -pRootPassw0rd123 -e 'SELECT CURRENT_USER(), @@innodb_buffer_pool_size, @@performance_schema, @@port;'
          if q -uroot -pwrongwrongwrong -e 'SELECT 1' 2>/dev/null; then echo 'wrong password accepted'; exit 1; fi
          if q -uapp -pAppPassw0rd456 mysql -e 'SELECT 1' 2>/dev/null; then echo 'app user reached mysql schema'; exit 1; fi
          # The first-start init file carries passwords; it must not linger.
          for i in $(seq 1 15); do docker exec ci test -e /tmp/renode-init.sql || break; sleep 1; done
          docker exec ci test ! -e /tmp/renode-init.sql
          stop ci
          docker rm ci

          # Same volume again: data kept, passwords unchanged even though the
          # env now carries different ones.
          docker run -d -t -i --name ci2 --user 988:988 \
            --cap-drop setpcap --cap-drop mknod --cap-drop audit_write --cap-drop net_raw \
            --cap-drop dac_override --cap-drop fowner --cap-drop fsetid --cap-drop net_bind_service \
            --cap-drop sys_chroot --cap-drop setfcap --security-opt no-new-privileges \
            --memory 1g -p 25725:25725 -v /tmp/vol:/home/container \
            -e SERVER_PORT=25725 -e MYSQL_ROOT_PASSWORD=RootPassw0rd123 \
            -e MYSQL_DATABASE=ci_db -e MYSQL_USER=app -e MYSQL_PASSWORD=ChangedInEnv999 \
            -e STARTUP='mysqld --defaults-file=/tmp/renode.cnf' mysql-test:ci
          wait_ready ci2
          test "$(q -uapp -pAppPassw0rd456 ci_db -N -e 'SELECT id FROM t')" = 42
          if q -uapp -pChangedInEnv999 ci_db -e 'SELECT 1' 2>/dev/null; then echo 'password was reset'; exit 1; fi

          # Console lines run as SQL.
          docker exec ci2 bash -c 'MYSQL_PWD=RootPassw0rd123 mysql --defaults-file=/tmp/renode.cnf -uroot -N -e "SELECT COUNT(*) FROM ci_db.t"' | grep -q 1
          stop ci2

      # A server that cannot start must take the container down with it, or
      # Wings reports "starting" for ever.
      - name: Failure exits
        run: |
          mkdir -p /tmp/vol2 && sudo chown 988:988 /tmp/vol2
          docker run -d -t -i --name bad --user 988:988 -v /tmp/vol2:/home/container \
            -e MYSQL_ROOT_PASSWORD=RootPassw0rd123 -e STARTUP='echo failing on purpose; exit 3' mysql-test:ci
          for i in $(seq 1 60); do docker inspect -f '{{.State.Running}}' bad | grep -q false && break; sleep 1; done
          docker logs bad 2>&1 | tail -5
          docker inspect -f 'exit={{.State.ExitCode}} running={{.State.Running}}' bad | tee /dev/stderr | grep -q 'exit=3 running=false'

          docker run -d -t -i --name nopw --user 988:988 -v /tmp/vol2:/home/container mysql-test:ci
          for i in $(seq 1 30); do docker inspect -f '{{.State.Running}}' nopw | grep -q false && break; sleep 1; done
          docker logs nopw 2>&1 | tail -3
          docker inspect -f 'exit={{.State.ExitCode}} running={{.State.Running}}' nopw | tee /dev/stderr | grep -q 'exit=1 running=false'

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
